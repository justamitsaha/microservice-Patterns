<div class="container">
  <h2>Customers</h2>
  <div *ngIf="error" class="error">{{error}}</div>

  <table>
    <thead><tr><th>ID</th><th>Name</th><th>Email</th><th></th></tr></thead>
    <tbody>
      <tr *ngFor="let c of customers">
        <td>{{c.id}}</td>
        <td><a [routerLink]="['/customers', c.id]">{{c.name}}</a></td>
        <td>{{c.email}}</td>
        <td><button (click)="delete(c.id!)">Delete</button></td>
      </tr>
    </tbody>
  </table>
</div>
