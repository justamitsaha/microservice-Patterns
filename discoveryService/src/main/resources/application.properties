spring.application.name=${SPRING_APP_NAME:discovery-service}
spring.config.import=${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}
server.port=${SERVER_PORT:8761}
#Can be overridden from Env variables with value confluent to load confluent based kafka properties from application-confluent.properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}


# =========================================
# ? Logging Configuration
# =========================================
# Custom console log pattern for colorized output and detailed tracing.
# Shows timestamp, log level, thread name, class, method, and message.
logging.pattern.console=${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%class.%M:%L) - %msg%n}
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework.boot=${LOG_LEVEL_SPRING_BOOT:WARN}
logging.level.org.springframework.cloud=${LOG_LEVEL_SPRING_CLOUD:WARN}
logging.level.com.netflix.eureka=INFO
logging.level.org.springframework.integration=${LOG_LEVEL_SI:ERROR}
logging.level.io.opentelemetry=${LOG_LEVEL_OTEL:ERROR}


# =========================================
# ? Eureka Server Configuration
# =========================================
# This service acts as a Eureka Server (not a client),it should not attempt to register itself with Eureka instance.
eureka.client.register-with-eureka=${EUREKA_REGISTER_WITH_EUREKA:false}
# Similarly, it should not try to fetch the registry since it maintains its own service registry.
eureka.client.fetch-registry=${EUREKA_FETCH_REGISTRY:false}

# Wait time (in milliseconds) before syncing registry data when the Eureka server starts and finds an empty registry.
# Setting this to 0 means "do not wait" ? start immediately.
eureka.server.wait-time-in-ms-when-sync-empty=${EUREKA_WAIT_TIME:0}

# =========================================
# ?? Actuator & Management Endpoints
# =========================================
# Exposes key endpoints for:
#   - health:      Application health
#   - info:        Build/version info
#   - metrics:     System performance metrics
#   - prometheus:  Prometheus scrape endpoint for Grafana dashboards
#   - refresh:     Manual refresh of configuration
#   - busrefresh:  Broadcast refresh events via Spring Cloud Bus
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,metrics,prometheus,refresh,busrefresh}

# =========================================
# ? Distributed Tracing (OpenTelemetry)
# =========================================
# Defines the tracing sample probability ? 1.0 means trace every request.
# You can reduce this (e.g., to 0.1) in production for lower overhead.
# management.tracing.sampling.probability=${TRACING_SAMPLING:1.0}

# OTLP (OpenTelemetry Protocol) endpoint to send distributed tracing data.
# The collector (e.g., OpenTelemetry Collector or Grafana Agent)
# listens on port 4318 to receive these trace spans.
# management.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}


